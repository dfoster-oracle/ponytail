name: ponytail-aipack
description: Run Ponytail's native activation and mode hooks in Claude Code and Codex.
events:
  - on: run.start
    match:
      source: startup|resume|clear|compact
    handler:
      type: command
      command: 'node "{pack:root}/hooks/ponytail-aipack.cjs" run.start'
      timeout: 5s
  - on: prompt.submit
    handler:
      type: command
      command: 'node "{pack:root}/hooks/ponytail-aipack.cjs" prompt.submit'
      timeout: 5s
